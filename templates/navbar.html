<nav class="navbar">
    <a href="{% url 'home' %}" class="nav-brand">ServiFixy</a>
    <div class="nav-links">
        <a href="{% url 'service_list' %}">Services</a>
        <a href="{% url 'search' %}">Search</a>
        {% if request.user.is_authenticated %}
            {% if user_profile.role == 'customer' %}
                <a href="{% url 'booking_history' %}">My Bookings</a>
            {% endif %}
            <a href="{% url 'profile' %}" style="display:flex;align-items:center;gap:8px;">
                {% if user_profile.profile_image %}
                    <img src="{{ user_profile.profile_image.url }}"
                         style="width:32px;height:32px;border-radius:50%;
                                object-fit:cover;border:2px solid rgba(255,255,255,0.5);">
                {% else %}
                    <div style="width:32px;height:32px;border-radius:50%;
                                background:rgba(255,255,255,0.2);
                                display:flex;align-items:center;justify-content:center;
                                font-size:16px;border:2px solid rgba(255,255,255,0.5);">
                        👤
                    </div>
                {% endif %}
                <span>{{ request.user.username }}</span>
            </a>
            <a href="{% url 'logout' %}">Logout</a>
        {% else %}
            <a href="{% url 'login' %}">Login</a>
            <a href="{% url 'register' %}">Register</a>
        {% endif %}
    </div>
</nav>
