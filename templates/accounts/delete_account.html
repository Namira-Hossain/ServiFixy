{% extends 'base.html' %}
{% block content %}

<div class="form-container">
    <h2>Delete Account</h2>
    <p style="margin-bottom:15px;">
        Are you sure? This cannot be undone.
    </p>
    <form method="POST">
        {% csrf_token %}
        <button type="submit" class="btn">Yes Delete</button>
        <a href="{% url 'profile' %}" class="btn btn-outline">Cancel</a>
    </form>
</div>

{% endblock %}
